<app-page-header page_title="Categories"/>

<ion-content>
    <ion-grid>
        <ion-row>
            <ion-col>
                <ion-item>
                    <ion-icon slot="start" name="swap-vertical"/>
                    <ion-select interface="popover" placeholder="Sort" [value]="sort()" (ionChange)="sort.set($event.detail.value)">
                        <ion-select-option value="createdAt,DESC">Created at (newest first)</ion-select-option>
                        <ion-select-option value="createdAt,ASC">Created at (oldest first)</ion-select-option>
                        <ion-select-option value="name,ASC">Name (A-Z)</ion-select-option>
                        <ion-select-option value="name,DESC">Name (Z-A)</ion-select-option>
                    </ion-select>
                </ion-item>
            </ion-col>
            <ion-col>
                <ion-item>
                    <ion-icon slot="start" name="search"/>
                    <ion-input debounce="300" placeholder="Search" [value]="search()" (ionInput)="search.set($event.detail.value ?? '')"/>
                </ion-item>
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col>
                    @for (category of categories; track category.id) {
                        <ion-item button detail (click)="openCategory(category)">
                            <ion-label>{{ category.name }}</ion-label>
                        </ion-item>
                    } @empty {
                        <ion-item>
                            <ion-icon slot="start" name="alert-circle-outline"/>
                            <ion-label>No categories found</ion-label>
                        </ion-item>
                    }
            </ion-col>
        </ion-row>
    </ion-grid>

    <ion-fab slot="fixed" vertical="bottom" horizontal="end" (click)="newCategory()">
        <ion-fab-button>
            <ion-icon name="add"/>
        </ion-fab-button>
    </ion-fab>
</ion-content>


<ion-footer>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-button [disabled]="page() === 0" (click)="page.set(page() - 1)">
                <ion-icon slot="icon-only" name="chevron-back"/>
            </ion-button>
        </ion-buttons>

        <ion-title class="ion-text-center">{{ page() + 1 }} / {{ totalPages }}</ion-title>

        <ion-buttons slot="end">
            <ion-button [disabled]="page() + 1 >= totalPages" (click)="page.set(page() + 1)">
                <ion-icon slot="icon-only" name="chevron-forward"/>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-footer>
